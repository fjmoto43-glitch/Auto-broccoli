<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TierBoard</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#dce2ec;--accent:#6759e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.dark{--bg:#0c1220;--panel:#151e30;--ink:#edf2ff;--muted:#9aa8bf;--line:#2b3850}.wrap{max-width:1100px;margin:auto;padding:22px 14px}header,.actions,.tools,.right{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:24px;font-weight:900}.brand b{color:var(--accent)}button{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);color:white}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;margin:14px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}textarea{min-height:80px}.board{display:grid;gap:8px}.tier{display:grid;grid-template-columns:95px 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;min-height:76px}.rank{display:grid;place-items:center;font-weight:900;font-size:20px;outline:none}.items,.pool{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:8px;min-height:74px}.chip{padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:grab;overflow-wrap:anywhere}.over{outline:3px dashed var(--accent);outline-offset:-3px}.drop-slot{flex:0 0 8px;min-width:8px;min-height:40px;border:2px dashed var(--accent);border-radius:6px;background:var(--accent);opacity:.35;pointer-events:none}.muted,.hint{font-size:12px;color:var(--muted)}.hidden{display:none}.modal.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px}.modal>div{background:var(--panel);padding:18px;border-radius:12px;width:min(560px,100%)}@media(max-width:600px){.meta{grid-template-columns:1fr}.tier{grid-template-columns:70px 1fr}}
</style><body><main class="wrap"><header><div class="brand">Tier<b>Board</b></div><div class="actions"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="theme">☾</button><button id="png">PNG出力</button><button id="share" class="primary">共有リンク</button></div></header>
<section class="panel meta"><div class="field"><label>タイトル</label><input id="title" value="お気に入りティア表"></div><div class="field"><label>作成者</label><input id="author" placeholder="任意"></div><div class="muted" id="status" style="grid-column:1/-1">このブラウザに自動保存します。</div></section>
<section class="panel"><div class="tools"><div style="flex:1"><b>アイテムを一括追加</b><textarea id="bulk" placeholder="1行に1つ入力&#10;カレー&#10;ラーメン&#10;オムライス"></textarea><div class="hint">改行区切りで複数追加できます。</div></div><div class="right"><button id="add" class="primary">まとめて追加</button><button id="clear">未配置を消去</button></div></div></section>
<section class="panel"><div class="board" id="board"></div></section><section class="panel"><b>未配置アイテム</b><div class="pool" id="pool" data-zone="pool"></div><div class="hint">カードをドラッグして移動。ダブルクリックで名前変更、右クリックで削除。</div></section>
<p class="muted">共有リンクは作成時点の内容をコピーするスナップショットです。元の表とのリアルタイム同期ではありません。</p></main>
<div class="modal hidden" id="modal"><div><b>共有リンク</b><p class="muted">リンクを開くと現在の表を複製して編集できます。</p><textarea id="url" readonly></textarea><div class="right"><button id="copy" class="primary">コピー</button><button id="close">閉じる</button></div></div></div>
<script>
const defaults=[['SS','#f4a6a6'],['S','#f6c58c'],['A','#f4df91'],['B','#b9dc9b'],['C','#9fd9d2'],['D','#9dc7ee'],['E','#b9afea'],['F','#d2b5df']];
const fresh=()=>({title:'お気に入りティア表',author:'',ranks:defaults.map(([name,color])=>({name,color,items:[]})),pool:[]});
let s=fresh(),past=[],future=[],drag=null;const $=id=>document.getElementById(id),id=()=>Math.random().toString(36).slice(2,10);
function snap(){past.push(JSON.stringify(s));if(past.length>60)past.shift();future=[]}
function save(){localStorage.setItem('tierboard',JSON.stringify(s));$('status').textContent='✓ このブラウザに保存済み'}
function all(){return [...s.pool,...s.ranks.flatMap(r=>r.items)]}function remove(key){s.pool=s.pool.filter(x=>x.id!==key);s.ranks.forEach(r=>r.items=r.items.filter(x=>x.id!==key))}
function chip(x){let e=document.createElement('div');e.className='chip';e.draggable=true;e.dataset.itemId=x.id;e.textContent=x.text;e.ondragstart=ev=>{drag=x.id;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',x.id)};e.ondblclick=()=>{let v=prompt('名前を変更',x.text);if(v&&v.trim()){snap();x.text=v.trim();save();render()}};e.oncontextmenu=ev=>{ev.preventDefault();if(confirm('削除しますか？')){snap();remove(x.id);save();render()}};return e}
function drop(el){let slot=null;const clearSlot=()=>{if(slot){slot.remove();slot=null}};el.ondragover=e=>{e.preventDefault();el.classList.add('over');let target=e.target.closest('.chip');if(target&&target.parentElement===el){let r=target.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;if(!slot){slot=document.createElement('div');slot.className='drop-slot'}el.insertBefore(slot,after?target.nextSibling:target)}else if(!target){if(!slot){slot=document.createElement('div');slot.className='drop-slot'}el.append(slot)}};el.ondragleave=e=>{if(!el.contains(e.relatedTarget)){el.classList.remove('over');clearSlot()}};el.ondrop=e=>{e.preventDefault();el.classList.remove('over');let key=drag||e.dataTransfer.getData('text/plain'),x=all().find(v=>v.id===key);if(!x){clearSlot();drag=null;return}let targetList=el.dataset.zone==='pool'?s.pool:s.ranks[+el.dataset.index].items;let index=slot?[...el.children].slice(0,[...el.children].indexOf(slot)).filter(n=>n.classList.contains('chip')).length:el.querySelectorAll('.chip').length;let sourceList=s.pool.includes(x)?s.pool:s.ranks.find(r=>r.items.includes(x))?.items;let sourceIndex=sourceList===targetList?sourceList.indexOf(x):-1;if(sourceIndex>=0&&sourceIndex<index)index--;clearSlot();snap();remove(key);targetList.splice(Math.max(0,Math.min(index,targetList.length)),0,x);drag=null;save();render()}}
function render(){$('title').value=s.title;$('author').value=s.author;$('board').innerHTML='';s.ranks.forEach((r,i)=>{let row=document.createElement('div');row.className='tier';let lab=document.createElement('div');lab.className='rank';lab.style.background=r.color;lab.contentEditable=true;lab.textContent=r.name;lab.onblur=()=>{if(lab.textContent.trim()!==r.name){snap();r.name=lab.textContent.trim()||'Tier';save()}};let items=document.createElement('div');items.className='items';items.dataset.zone='rank';items.dataset.index=i;r.items.forEach(x=>items.append(chip(x)));drop(items);row.append(lab,items);$('board').append(row)});$('pool').innerHTML='';s.pool.forEach(x=>$('pool').append(chip(x)));drop($('pool'));$('undo').disabled=!past.length;$('redo').disabled=!future.length}
$('add').onclick=()=>{let a=$('bulk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!a.length)return;snap();a.forEach(text=>s.pool.push({id:id(),text}));$('bulk').value='';save();render()};
$('clear').onclick=()=>{if(s.pool.length&&confirm('未配置アイテムを削除？')){snap();s.pool=[];save();render()}};
$('title').onchange=()=>{snap();s.title=$('title').value;save()};$('author').onchange=()=>{snap();s.author=$('author').value;save()};
$('undo').onclick=()=>{if(!past.length)return;future.push(JSON.stringify(s));s=JSON.parse(past.pop());save();render()};$('redo').onclick=()=>{if(!future.length)return;past.push(JSON.stringify(s));s=JSON.parse(future.pop());save();render()};
$('theme').onclick=()=>document.body.classList.toggle('dark');
function bytesToB64(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64ToBytes(value){let bin=atob(value.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(bin,ch=>ch.charCodeAt(0))}
async function compressText(value){let stream=new Blob([value]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}
async function decompressText(bytes){let stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}
function packState(state){return [1,state.title,state.author,state.ranks.map(r=>[r.name,r.color,r.items.map(x=>x.text)]),state.pool.map(x=>x.text)]}
function unpackState(data){if(!Array.isArray(data))return data;if(data[0]!==1)throw new Error('Unknown share format');return {title:data[1]||'',author:data[2]||'',ranks:(data[3]||[]).map(r=>({name:r[0],color:r[1],items:(r[2]||[]).map(text=>({id:id(),text}))})),pool:(data[4]||[]).map(text=>({id:id(),text}))}}
$('share').onclick=async()=>{let raw=JSON.stringify(packState(s)),v;try{v=bytesToB64(await compressText(raw));$('url').value=location.origin+location.pathname+'?s='+v}catch{v=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');$('url').value=location.origin+location.pathname+'?share='+v}$('modal').classList.remove('hidden')};
$('close').onclick=()=>$('modal').classList.add('hidden');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('url').value);$('copy').textContent='コピーしました'}catch{$('url').select();document.execCommand('copy')}};
$('png').onclick=()=>{let esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let w=1100,h=120+s.ranks.length*90;let svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><rect width="100%" height="100%" fill="#f4f6fb"/><text x="25" y="48" font-size="30" font-weight="bold" fill="#172033">'+esc(s.title)+'</text>';s.ranks.forEach((r,i)=>{let y=75+i*90;svg+='<rect x="25" y="'+y+'" width="1050" height="80" rx="8" fill="white" stroke="#dce2ec"/><rect x="25" y="'+y+'" width="105" height="80" rx="8" fill="'+r.color+'"/><text x="77" y="'+(y+48)+'" text-anchor="middle" font-size="23" font-weight="bold">'+esc(r.name)+'</text>';let x=145;r.items.forEach(it=>{let ww=Math.max(75,it.text.length*15+24);svg+='<rect x="'+x+'" y="'+(y+19)+'" width="'+ww+'" height="42" rx="7" fill="#f4f6fb" stroke="#dce2ec"/><text x="'+(x+10)+'" y="'+(y+45)+'" font-size="16">'+esc(it.text)+'</text>';x+=ww+8})});svg+='</svg>';let u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=w*2;c.height=h*2;c.getContext('2d').scale(2,2);c.getContext('2d').drawImage(im,0,0);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='tierboard.png';a.click();URL.revokeObjectURL(u)};im.src=u};
async function initialize(){try{let params=new URLSearchParams(location.search),compressed=params.get('s'),legacy=params.get('share');if(compressed){s=unpackState(JSON.parse(await decompressText(b64ToBytes(compressed))))}else if(legacy){s=unpackState(JSON.parse(decodeURIComponent(escape(atob(legacy.replace(/-/g,'+').replace(/_/g,'/'))))))}else if(localStorage.getItem('tierboard'))s=JSON.parse(localStorage.getItem('tierboard'))}catch{try{if(localStorage.getItem('tierboard'))s=JSON.parse(localStorage.getItem('tierboard'))}catch{}}history.replaceState({},'',location.pathname);render();save()}
initialize();
</script></body></html>
